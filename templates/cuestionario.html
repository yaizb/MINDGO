{% extends "base.html" %}
{% block title %}Crear Cuestionario - MindGo{% endblock %}
{% block content %}

<link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">

<div class="container-fluid px-0">
  <form id="formCuestionario" method="POST" action="#">
    <div class="container mt-4">
      <div class="tarjeta-pregunta" id="tarjetaPregunta">
        <label for="textoPregunta">Pregunta:</label>
        <textarea id="textoPregunta" name="texto_pregunta" rows="3" placeholder="Escribe tu pregunta aquí..." required></textarea>

        <div id="contenedorOpciones" class="row g-2"></div>

        <a href="#" class="enlace-agregar-respuesta" onclick="agregarOpcion(); return false;">
          <strong>➕ Añadir más respuestas</strong>
        </a>
      </div>

      <div class="mt-3 text-center">
        <button type="button" class="btn btn-primary" onclick="guardarCuestionarioCompleto()">
          💾 Guardar Cuestionario
        </button>
      </div>
    </div>
  </form>

  <!-- Paneles laterales -->
  <div id="panelIzquierdo">
    <div class="encabezado-panel">📝 Vista de Cuestionario</div>
    <div id="listaPreguntas"></div>
    <button class="btn-panel btn-agregar-pregunta" onclick="nuevaPregunta()">➕ Nueva Pregunta</button>
    <button class="btn-panel btn-duplicar-pregunta" onclick="duplicarPregunta()">📋 Duplicar</button>
    <button class="btn-panel btn-eliminar-pregunta" onclick="eliminarPreguntaActual()">🗑️ Eliminar</button>
  </div>

  <div id="panelDerecho">
    <div class="encabezado-panel">⚙️ Configuración Avanzada</div>

    <label class="etiqueta-panel">Tipo de pregunta:</label>
    <select class="seleccion-formulario" id="tipoPregunta" onchange="cambiarTipoPregunta()">
      <option value="quiz">Quiz</option>
      <option value="verdadero_falso">Verdadero / Falso</option>
      <option value="seleccion_multiple">Selección Múltiple</option>
    </select>

    <div class="separador-config"></div>

    <label class="etiqueta-panel">Tiempo límite:</label>
    <select class="seleccion-formulario" id="tiempoLimite">
      <option value="10">10 segundos</option>
      <option value="30" selected>30 segundos</option>
      <option value="60">1 minuto</option>
    </select>

    <div class="separador-config"></div>

    <label class="etiqueta-panel">Tipo de puntuación:</label>
    <select class="seleccion-formulario" id="tipoPuntuacion">
      <option value="simple" selected>Simple (5 pts)</option>
      <option value="doble">Doble (10 pts)</option>
    </select>
  </div>

  <div class="flecha-navegacion izquierda" id="flechaIzq" onclick="alternarPanelIzquierdo()">‹</div>
  <div class="flecha-navegacion derecha" id="flechaDer" onclick="alternarPanelDerecho()">›</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/cuestionario.js') }}"></script>



{% endblock %}
