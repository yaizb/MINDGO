{% extends "base.html" %}

{% block title %}Editar Lugar de Trabajo | nombrePagina{% endblock %}

{% block content %}
<section class="form-section">
  <h1 class="form-title">Editar Lugar de Trabajo</h1>

  <div class="form-card">
    <form action="{{ url_for('actualizar_lugar_trabajo', idLugar=lugar[0]) }}" method="post" class="form-crud">
      <label for="nombreLugar">Nombre del Lugar:</label>
      <input type="text" id="nombreLugar" name="nombreLugar" value="{{ lugar[1] }}" required>

      <label for="dominio" style="margin-top: 10px;">Dominio:</label>
      <input type="text" id="dominio" name="dominio" value="{{ lugar[2] }}" required>

      <button type="submit" class="btn full yellow" style="margin-top: 15px;">Actualizar</button>
      <a href="{{ url_for('listar_lugares_trabajo') }}" class="btn full white" style="margin-top: 10px;">Cancelar</a>
    </form>
  </div>
</section>
{% endblock %}
