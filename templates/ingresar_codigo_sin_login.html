{% extends "base.html" %}
{% block title %}Ingresar código - MindGo{% endblock %}

{% block content %}
<section class="ingresar-codigo">
  <h1>MindGo</h1>

  <form action="{{ url_for('validar_codigo') }}" method="POST">
    <input type="text" name="codigo" placeholder="Introduce un código para participar" required>
    <button type="submit">Unir</button>
  </form>
</section>
{% endblock %}
